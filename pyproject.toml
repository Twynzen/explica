[project]
name = "explica"
version = "0.1.0"
description = "Local, agent-controllable lab for explanatory videos: declarative scenes, multilayer timeline, Kdenlive round-trip and an MCP server over the same core."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Twynzen" }]
keywords = ["video", "mcp", "kdenlive", "mlt", "ffmpeg", "explanatory", "animation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pycairo>=1.26",
  "mcp>=1.2",  # 1.x (FastMCP) and 2.x (MCPServer) both supported
]

[project.optional-dependencies]
tts = ["piper-tts>=1.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
explica = "explica.cli:main"
explica-mcp = "explica.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Twynzen/explica"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
